name: Connect Four

on:
  issues:
    types: [opened]
  workflow_dispatch: # manual run: only re-renders the README

permissions:
  contents: write
  issues: write

# One move at a time, so two simultaneous issues can't clash.
concurrency:
  group: connect4
  cancel-in-progress: false

jobs:
  play:
    # Only react to issues created through the game links.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'c4|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The issue title is untrusted input: pass it through env, never inline in a shell command.
      - name: Play the move
        run: node scripts/handle-move.js
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md game/state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect Four: move by ${{ github.event.issue.user.login || 'manual run' }}"
            git push
          fi

      - name: Reply and close the issue
        if: github.event_name == 'issues'
        run: |
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
