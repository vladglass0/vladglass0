<svg xmlns="http://www.w3.org/2000/svg" width="120" height="64" viewBox="0 0 120 64" role="img" aria-label="Drop a piece here"><title>Drop a piece here</title><style>text{font-family:G,'Google Sans','Segoe UI',Roboto,sans-serif;font-variation-settings:'ROND' 100}.up{animation:up .8s cubic-bezier(.05,.7,.1,1) both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .3s both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="12" y="8" width="96" height="48" rx="24" fill="#ffd65c"/><path d="M60 21v20m-8-8l8 8l8-8" fill="none" stroke="#3d2e00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
